<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Support Auto-Triage</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
  <header>
    <h1>AI Customer Support Auto-Triage</h1>
    <p>Classify support tickets automatically using NLP.</p>
  </header>

  <section class="card">
    <label>Ticket Subject</label>
    <input id="subject" placeholder="Example: Payment problem">

    <label>Ticket Description</label>
    <textarea id="description" rows="7" placeholder="Example: My payment was deducted but my order was not created."></textarea>

    <button onclick="analyze()">Analyze Ticket</button>
    <div id="error"></div>
  </section>

  <section id="result" class="card result hidden">
    <h2>AI Analysis</h2>
    <div class="grid">
      <div><span>Category</span><strong id="category">-</strong></div>
      <div><span>Department</span><strong id="department">-</strong></div>
      <div><span>Priority</span><strong id="priority">-</strong></div>
      <div><span>Model</span><strong id="model">-</strong></div>
    </div>
  </section>
</div>
<script>
async function analyze() {
  const error = document.getElementById("error");
  error.textContent = "";
  const payload = {
    subject: document.getElementById("subject").value,
    description: document.getElementById("description").value
  };
  try {
    const r = await fetch("/predict", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload)
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || "Prediction failed");
    document.getElementById("category").textContent = data.category;
    document.getElementById("department").textContent = data.department;
    document.getElementById("priority").textContent = data.priority;
    document.getElementById("model").textContent = data.model;
    document.getElementById("result").classList.remove("hidden");
  } catch (e) {
    error.textContent = e.message;
  }
}
</script>
</body>
</html>
